<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Retro Sunset Circle -->
  <defs>
    <linearGradient id="retro-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1E75" />
      <stop offset="100%" stop-color="#FFD214" />
    </linearGradient>
  </defs>
  
  <!-- Sun with slices -->
  <mask id="sun-mask">
    <rect x="10" y="10" width="180" height="180" fill="#ffffff" />
    <!-- Horizontal bars cutting the sun -->
    <rect x="0" y="95" width="200" height="4" fill="#000000" />
    <rect x="0" y="98" width="200" height="4" fill="#000000" />
    <rect x="0" y="105" width="200" height="6" fill="#000000" />
    <rect x="0" y="117" width="200" height="8" fill="#000000" />
    <rect x="0" y="131" width="200" height="11" fill="#000000" />
    <rect x="0" y="148" width="200" height="15" fill="#000000" />
  </mask>
  
  <circle cx="100" cy="95" r="65" fill="url(#retro-sun)" mask="url(#sun-mask)" />
  
  <!-- Retro Grid / Ocean Floor -->
  <path d="M20,150 L180,150 L195,185 L5,185 Z" fill="#1E182A" stroke="#FF1E75" stroke-width="4" stroke-linejoin="round" />
  <!-- Grid Perspective Lines -->
  <line x1="50" y1="150" x2="20" y2="185" stroke="#FF1E75" stroke-width="3" />
  <line x1="80" y1="150" x2="70" y2="185" stroke="#FF1E75" stroke-width="3" />
  <line x1="100" y1="150" x2="100" y2="185" stroke="#FF1E75" stroke-width="3" />
  <line x1="120" y1="150" x2="130" y2="185" stroke="#FF1E75" stroke-width="3" />
  <line x1="150" y1="150" x2="180" y2="185" stroke="#FF1E75" stroke-width="3" />
  <!-- Horizontal Grid Lines -->
  <line x1="15" y1="160" x2="185" y2="160" stroke="#FF1E75" stroke-width="2" />
  <line x1="10" y1="172" x2="190" y2="172" stroke="#FF1E75" stroke-width="2" />
  
  <!-- Silhouette Palm Trees -->
  <!-- Left Palm -->
  <path d="M40,152 C45,130 55,110 70,95 C66,105 60,118 60,130" fill="none" stroke="#1E182A" stroke-width="6" stroke-linecap="round" />
  <path d="M70,95 C60,90 45,95 35,100 C50,92 65,92 70,95 Z" fill="#1E182A" />
  <path d="M70,95 C75,85 85,78 95,78 C83,83 75,90 70,95 Z" fill="#1E182A" />
  <path d="M70,95 C80,95 95,100 100,110 C88,103 76,98 70,95 Z" fill="#1E182A" />
  <path d="M70,95 C60,82 50,75 38,78 C52,80 64,88 70,95 Z" fill="#1E182A" />
  
  <!-- Tiny Palm on Right -->
  <path d="M150,152 C148,135 142,120 132,110 C135,118 138,128 140,138" fill="none" stroke="#1E182A" stroke-width="4" stroke-linecap="round" />
  <path d="M132,110 C125,108 115,112 110,115 Q125,110 132,110 Z" fill="#1E182A" />
  <path d="M132,110 C135,102 142,98 148,98 Q140,102 132,110 Z" fill="#1E182A" />
  <path d="M132,110 C138,110 148,112 152,118 Q144,114 132,110 Z" fill="#1E182A" />
</svg>
