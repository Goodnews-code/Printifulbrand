<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background circular splatter / accent -->
  <circle cx="100" cy="100" r="85" fill="#7C3AED" opacity="0.2" />
  <circle cx="100" cy="100" r="75" fill="none" stroke="#7C3AED" stroke-dasharray="10, 15" stroke-width="3" />
  
  <!-- Skull Head -->
  <path d="M60,110 C50,100 45,70 100,50 C155,70 150,100 140,110 C140,130 135,130 130,135 L125,160 C125,165 115,165 115,160 L110,145 L90,145 L85,160 C85,165 75,165 75,160 L70,135 C65,130 60,130 60,110 Z" fill="#ffffff" stroke="#1E182A" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Teeth lines -->
  <path d="M90,145 L90,155 M100,145 L100,158 M110,145 L110,155 M85,150 L115,150" stroke="#1E182A" stroke-width="4" stroke-linecap="round" />
  
  <!-- Nose Cavity (inverted heart shape) -->
  <path d="M100,123 C95,117 90,120 100,132 C110,120 105,117 100,123 Z" fill="#1E182A" />

  <!-- Streetwear Sunglasses -->
  <path d="M45,95 L155,95 L150,115 C150,120 135,125 105,115 L95,115 C65,125 50,120 50,115 Z" fill="#FF1E75" stroke="#1E182A" stroke-width="5" stroke-linejoin="round" />
  <path d="M55,100 L95,100 L90,112 C75,116 60,114 55,108 Z" fill="#FFD214" opacity="0.8" />
  <path d="M145,100 L105,100 L110,112 C125,116 140,114 145,108 Z" fill="#FFD214" opacity="0.8" />
  
  <!-- Headphone Band -->
  <path d="M55,75 C60,40 140,40 145,75" fill="none" stroke="#1E182A" stroke-width="8" stroke-linecap="round" />
  
  <!-- Ear cups -->
  <rect x="38" y="70" width="16" height="36" rx="8" fill="#1E182A" transform="rotate(-10 46 88)" />
  <rect x="35" y="73" width="10" height="30" rx="5" fill="#FF1E75" transform="rotate(-10 40 88)" />
  
  <rect x="146" y="70" width="16" height="36" rx="8" fill="#1E182A" transform="rotate(10 154 88)" />
  <rect x="155" y="73" width="10" height="30" rx="5" fill="#FF1E75" transform="rotate(10 160 88)" />
</svg>
